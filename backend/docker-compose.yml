name: hr-service-desk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrdesk}
      POSTGRES_USER: ${POSTGRES_USER:-hrdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-hrdesk};Username=${POSTGRES_USER:-hrdesk};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 characters)}
      Seed__Enabled: "true"
      Seed__DemoPassword: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
      Seed__History: ${SEED_HISTORY:-true}
      Storage__RootPath: /app/data/attachments
      BackgroundJobs__Enabled: "true"
      Smtp__Enabled: "true"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__AppUrl: http://localhost:${WEB_PORT:-8080}
      Swagger__Enabled: "true"
      Integration__SecretKey: ${INTEGRATION_SECRET_KEY:?Set INTEGRATION_SECRET_KEY in .env}
      Integration__AllowInsecureWebhookUrls: "true"
      Integration__AllowPrivateNetworks: "true"
      Seed__PayrollApiKey: ${PAYROLL_API_KEY:-}
      Seed__PayrollWebhookSecret: ${PAYROLL_WEBHOOK_SECRET:-}
      Seed__PayrollWebhookUrl: http://mock-payroll:8080/webhooks
      Auth__SsoAllowInsecureUrls: "true"
      Seed__SsoMockAuthority: http://localhost:${MOCK_IDP_PORT:-8095}
      Seed__SsoMockMetadataAddress: http://mock-idp:8080/.well-known/openid-configuration
      Seed__SsoMockClientSecret: ${SSO_MOCK_CLIENT_SECRET:-}
      Logging__Json: "true"
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://localhost:8080
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

  # Stand-in for an external payroll system: receives signed webhooks, resolves payroll cases via the integration API.
  mock-payroll:
    build:
      context: .
      dockerfile: tools/MockPayroll/Dockerfile
    environment:
      Payroll__DeskApiUrl: http://api:8080
      Payroll__ApiKey: ${PAYROLL_API_KEY:-}
      Payroll__WebhookSecret: ${PAYROLL_WEBHOOK_SECRET:-}
      Payroll__ProcessingDelaySeconds: "5"
    ports:
      - "${MOCK_PAYROLL_PORT:-8090}:8080"

  # Stand-in for Microsoft Entra ID: OpenID Connect provider with an account picker (Acme's SSO in the demo).
  mock-idp:
    build:
      context: .
      dockerfile: tools/MockIdp/Dockerfile
    environment:
      Idp__PublicUrl: http://localhost:${MOCK_IDP_PORT:-8095}
      Idp__InternalUrl: http://mock-idp:8080
      Idp__ClientId: hr-service-desk
      Idp__ClientSecret: ${SSO_MOCK_CLIENT_SECRET:-}
    ports:
      - "${MOCK_IDP_PORT:-8095}:8080"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  attachments:
